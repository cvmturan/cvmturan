<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'"><title>TShow player</title><link rel="stylesheet" href="player.css"></head><body>
<header><button id="back">← Sources</button><div class="heading"><small>TSHOW PLAYER</small><h1 id="title">Opening video</h1></div><button id="fullscreen" aria-label="Toggle fullscreen">⛶ Fullscreen</button></header>
<main><div id="loading" role="status"><div class="spinner"></div><h2 id="message">Connecting to your source…</h2><p id="detail">Playback controls are ready below.</p><button id="retry" hidden>Try this source again</button></div></main>
<footer><div class="status"><span id="status" aria-live="polite">Connecting…</span><span id="time">0:00 / 0:00</span></div><input type="range" id="seek" min="0" max="100" step="1" value="0" aria-label="Video timeline" disabled>
<div class="controls"><button id="rewind" aria-label="Back 10 seconds">↶ 10s</button><button id="pause" disabled>Pause</button><button id="forward" aria-label="Forward 10 seconds">10s ↷</button><label>Volume <input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume"></label><label>Audio <select id="audio" aria-label="Audio track"><option>No tracks yet</option></select></label><label>Subtitles <select id="subtitle" aria-label="Subtitle track"><option value="no">Off</option></select></label><select id="speed" aria-label="Playback speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></div></footer><script src="player-ui.js"></script></body></html>
